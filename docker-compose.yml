services:
  api:
    build: .
    command: uvicorn app.api:api --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      REPOPILOT_API_TOKEN: ${REPOPILOT_API_TOKEN:-}
      REPOPILOT_REPO_ROOT: /app/repos
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./repos:/app/repos

  dashboard:
    build: .
    command: streamlit run app/ui.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - .env
    environment:
      REPOPILOT_REPO_ROOT: /app/repos
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./repos:/app/repos
